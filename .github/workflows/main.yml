name: Generate YouTube Short

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install everything and run generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          echo "🚀 Asennetaan järjestelmäriippuvuudet (ffmpeg)..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          echo "📦 Asennetaan Python-kirjastot..."
          python -m pip install --upgrade pip
          pip install groq google-genai edge-tts requests ffmpeg-python mutagen google-auth-oauthlib google-auth-httplib2 google-api-python-client python-dotenv
          
          echo "🔑 Luodaan .env tiedosto..."
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "YOUTUBE_CLIENT_SECRET_JSON='${{ secrets.YOUTUBE_CLIENT_SECRET }}'" >> .env
          
          echo "▶️ Käynnistetään Short Generator..."
          python main.py